# The configuration tests/lang/200 and 201 are generated from.
#
# It is deliberately NOT one of the four that ship: it turns the floppy key
# on nothing else does (so there is a driver key the tests can watch be
# dropped), it picks the Pentium floor (so a >= comparison against CpuKind is
# exercised rather than assumed), and it includes the real base.conf so that
# include resolution is tested and not mocked.

include ../../os/kernel/config/base.conf

X86 = true
Cpu = Pentium
Fpu = true
Firmware = Bios

DriverIde = true
DriverSerial8250 = true
DriverVgaText = false
DriverKeyboard8042 = false
DriverNe2000 = false
DriverFloppy = false

ConsoleDevice = Serial
SerialConsoleBase = 0x2F8
Ne2000Base = 0x320
Ne2000Irq = 10
DebugAsserts = false
