# tests/lang/200_kconfig_test.conf with one key changed.
#
# It exists so that 202_kconfig_tool.sh can build test 201 twice from two
# generated Configs and compare the results. A dropped branch cannot be seen
# from inside the program that dropped it, and it cannot be seen reliably
# with nm either, because the compiler inlines a small Probe before it drops
# anything and neither build then has a symbol for it. What it CAN be seen by
# is the difference between the two builds: the floppy build is bigger and
# prints a line the other cannot print at all.

include 200_kconfig_test.conf

DriverFloppy = true
